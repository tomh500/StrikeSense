<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrikeSense | 资源下载中心</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="rescenter.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">StrikeSense</a>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">返回首页</a>
                <a href="docs.html">文档中心</a>
                <a href="oem.html">OEM 密钥生成</a>
                <a href="#res-section" class="active-link">资源下载中心</a>
            </nav>
        </div>
    </header>

    <section class="res-hero">
        <div class="container">
            <span class="badge">资源与扩展中心</span>
            <h1>下载资源、脚本与站内工具</h1>
            <p class="subtitle">资源列表由本地 JSON 统一维护，支持标签筛选、搜索与分页，方便后续继续扩展。</p>
        </div>
    </section>

    <section id="res-section" class="res-main-section">
        <div class="container">
            <div class="filter-panel">
                <div class="search-box-wrap">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="搜索标题、简介、提供者或标签">
                </div>

                <div class="tag-filter-wrap">
                    <span class="filter-title">分类筛选：</span>
                    <div class="tags-group" id="tagsGroup">
                        <button class="filter-tag" data-tag="官方">官方</button>
                        <button class="filter-tag" data-tag="社区">社区</button>
                        <button class="filter-tag" data-tag="音乐盒">音乐盒</button>
                        <button class="filter-tag" data-tag="击杀音效">击杀音效</button>
                        <button class="filter-tag" data-tag="脚本">脚本</button>
                        <button class="filter-tag" data-tag="工具">工具</button>
                    </div>
                </div>
            </div>

            <div class="res-grid" id="resGrid"></div>
            <div class="pagination-wrap" id="paginationWrap"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-content">
            <p class="copyright">&copy; 2026 StrikeSense. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        menuToggle?.addEventListener('click', () => {
            menuToggle.classList.toggle('open');
            navLinks.classList.toggle('open');
        });
    </script>
    <script src="data/resources.generated.js"></script>
    <script src="rescenter.js"></script>
</body>
</html>
