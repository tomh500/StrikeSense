<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=vscript_studio.html">
    <title>StrikeSense VScript 编辑器</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 24px;
        }

        .redirect-card {
            width: min(640px, 100%);
            background: var(--bg-card);
            border: 1px solid rgba(9, 114, 122, 0.08);
            border-radius: 16px;
            box-shadow: 0 14px 36px rgba(9, 114, 122, 0.08);
            padding: 28px;
            text-align: center;
        }

        .redirect-card h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .redirect-card p {
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <main class="redirect-card">
        <span class="badge">VScript 图形编程</span>
        <h1>正在跳转到新版工作台</h1>
        <p>旧的编辑器入口已经切换到更完整的积木式图形编程页面。若浏览器没有自动跳转，直接打开 <a href="vscript_studio.html">vscript_studio.html</a> 即可。</p>
        <a class="btn btn-primary" href="vscript_studio.html">前往新工作台</a>
    </main>
</body>
</html>
